[package]
name = "vykar-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Internal
vykar-types.workspace = true
vykar-common.workspace = true
vykar-crypto.workspace = true
vykar-storage.workspace = true
vykar-protocol.workspace = true

# Serialization
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
rmp = "0.8"
rmp-serde.workspace = true

# Crypto
blake2.workspace = true
# `derive_key` for the format-v3 plaintext chunk-ID key. Chunk/pack digests
# themselves live in vykar-types.
blake3.workspace = true
rand.workspace = true
zeroize.workspace = true
hex.workspace = true

# Compression
lz4_flex = "0.14"
zstd = "0.14"

# Chunking
fastcdc = "5.0.0"

# Filesystem
dunce = { workspace = true }
tempfile.workspace = true
globset = "0.4"
ignore = "0.4"

# Time
chrono.workspace = true
croner.workspace = true

# Memory-mapped I/O
memmap2 = "0.9"

# Probabilistic filter
xorf = "0.13"

# Small-vec optimization
# `union` drops the inline/heap tag: SmallVec<[WriteTarget; 1]> is 24 bytes, not 32.
smallvec = { version = "1", features = ["union"] }

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true
crossbeam-channel.workspace = true

# Async runtime (mount only)
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }

# Mount (WebDAV server)
dav-server = { version = "0.12", optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
lru = { version = "0.19", optional = true }
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", optional = true }
percent-encoding = { version = "2", optional = true }

[features]
default = []
backend-sftp = ["vykar-storage/backend-sftp"]
mount = ["dav-server", "tokio/rt-multi-thread", "tokio/macros", "tokio/signal", "tokio/net", "tokio/sync", "hyper", "hyper-util", "lru", "bytes", "futures-util", "percent-encoding"]
# Internal entry points for fuzz/ (src/fuzzing.rs, index::segment::model). Not API; never enable in a product build.
fuzzing = []
# Simulation harness for protocol tests (src/sim). Test support, not API;
# never enable in a product build.
sim = []
# Measurement entry points for examples/walk_order.rs and examples/listing_stats.rs (06 step 0). Not API.
measure = []

[[example]]
name = "walk_order"
required-features = ["measure"]

[[example]]
name = "listing_stats"
required-features = ["measure"]

[dev-dependencies]
proptest = { workspace = true }
test-case = { workspace = true }
# Extracts the frozen repository-format-v2 fixtures (tests/fixtures/*.tar.gz).
# Crates rather than shelling out to `tar` so the tests run on Windows too.
tar = "0.4"
flate2 = "1"
# In-process vykar-server for the REST end-to-end tests (src/tests/rest_server.rs).
vykar-server = { path = "../vykar-server" }
axum = "0.8"
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.32.0", features = ["fs", "hostname", "signal", "process"] }
xattr = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
