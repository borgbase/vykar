[package]
name = "vykar-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "vykar_cli"
path = "src/lib.rs"

[[bin]]
name = "vykar"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
vykar-core = { workspace = true, features = ["mount", "backend-sftp"] }
vykar-common.workspace = true
vykar-types.workspace = true
vykar-storage.workspace = true
clap.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
comfy-table = "8"
chrono.workspace = true
hex.workspace = true
rand.workspace = true
zeroize.workspace = true
tiny_http = "0.12"
serde_json.workspace = true
base64 = "0.23"

[dev-dependencies]
# vykar_core::testing (cheap KDF): tests create repositories through the library.
vykar-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
ureq.workspace = true
# `cli_integration` decodes the repository `config` to read its id.
rmp-serde.workspace = true
# `cli_integration` extracts a frozen v3 fixture (vykar-core/tests/fixtures).
tar = "0.4"
flate2 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
