[package]
name = "vykar-server"
version = "0.20.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
name = "vykar_server"
path = "src/lib.rs"

[[bin]]
name = "vykar-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Internal
vykar-common.workspace = true
vykar-protocol.workspace = true
# `HashAlgorithm` / `Hasher256`: the server must agree with the client on pack
# digests by construction, so both sides use the same code path.
vykar-types.workspace = true

# Web framework
axum = "0.8"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "time"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.7", features = ["trace"] }
tokio-util = { version = "0.7", features = ["io"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# CLI
clap.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }

# Time
chrono.workspace = true

# Crypto (constant-time compare for auth token)
subtle = "2"

# Streaming
futures-util = "0.3"

# Hex encoding
hex.workspace = true

# System calls (statvfs, quotactl)
libc = "0.2"

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Independent BLAKE2b reference for the upload-digest tests. The server itself
# no longer hand-rolls a digest — it uses `vykar_types::hash::Hasher256`, the
# same code path as the client's `PackId::compute`.
blake2.workspace = true
