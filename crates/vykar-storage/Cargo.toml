[package]
name = "vykar-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Internal
vykar-types.workspace = true
vykar-common.workspace = true
vykar-protocol.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Crypto
hex.workspace = true
rand.workspace = true

# Content-MD5 for S3 Object Lock compatibility
md-5 = "0.11"
base64 = "0.23"

# S3 LastModified (RFC 3339) in list_meta
chrono.workspace = true

# URL parsing
url = "2"
percent-encoding = "2"

# HTTP client (S3 + REST backends)
rusty-s3 = "0.11"
ureq = { workspace = true, features = ["json", "platform-verifier"] }
http = "1"

# Parse S3 multipart completion responses. Standalone direct dep: rusty-s3 uses
# instant-xml and does not pull quick-xml, so there is no duplicate copy to match.
quick-xml = { version = "0.42", features = ["serialize"] }

# Logging
tracing.workspace = true

# Filesystem
tempfile.workspace = true

# Async runtime (SFTP only)
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }

# SSH/SFTP
russh = { version = "0.65.1", default-features = false, features = ["aws-lc-rs", "rsa"], optional = true }
russh-sftp = { version = "3.0", optional = true }

[dev-dependencies]
# Argument parsing for the put_if_absent_probe example.
clap.workspace = true
# In-process SSH/SFTP fault server for the SFTP backend tests; `process` and
# `io-util` run sftp-server over stdio in the put_if_absent_probe example.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "time", "process", "io-util"] }
# Accept loop for the in-process ssh-agent in the SFTP tests.
futures-util = "0.3"

[features]
default = []
backend-sftp = ["russh", "russh-sftp", "tokio"]

[[example]]
name = "put_if_absent_probe"
required-features = ["backend-sftp"]
