[package]
name = "vykar-types"
version = "0.19.1"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lints]
workspace = true

[dependencies]
# Crypto (ChunkId, PackId) — SIMD BLAKE2b, byte-identical to RFC 7693.
# The RustCrypto `blake2` crate is scalar-only on stable, and these two digests
# are on the hottest path in the tool.
blake2b_simd = "1"

# BLAKE3 — the chunk/pack digest for repository format v3. Default features
# only: `hash`/`keyed_hash` are single-threaded regardless, and the `rayon`
# feature only affects `update_rayon`/`update_mmap_rayon`, which vykar never calls.
blake3.workspace = true

# Hex encoding
hex.workspace = true

# Random (SnapshotId)
rand.workspace = true

# Serialization
serde.workspace = true
rmp-serde.workspace = true

# Error handling
thiserror.workspace = true

# ChunkHasher carries the chunk-ID key
zeroize.workspace = true

[dev-dependencies]
# Independent reference implementation for the ChunkId/PackId equivalence tests.
blake2.workspace = true

# JSON is the wire format for `HashAlgorithm` in the REST DTOs.
serde_json.workspace = true
