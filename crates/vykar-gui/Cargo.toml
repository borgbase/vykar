[package]
name = "vykar-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

build = "build.rs"

[[bin]]
name = "vykar-gui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
vykar-core = { workspace = true, features = ["backend-sftp", "mount"] }
vykar-common.workspace = true
vykar-types.workspace = true
tokio = { workspace = true, features = ["sync"] }
opener = "0.8"
slint = { version = "~1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia", "accessibility", "system-tray"] }
crossbeam-channel.workspace = true
tinyfiledialogs = "3"
chrono.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
dunce = { workspace = true }
auto-launch = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree via Slint's ksni tray; used to wait for an SNI host.
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-lite = "2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSWindow"] }

[build-dependencies]
slint-build = "~1.18"
winresource = "0.1"

[dev-dependencies]
tempfile = { workspace = true }
# Real `Repository::open` in the passphrase-retry regression tests, and
# hand-built malformed key blobs for the corruption case.
vykar-storage.workspace = true
vykar-crypto.workspace = true
rmp-serde.workspace = true
