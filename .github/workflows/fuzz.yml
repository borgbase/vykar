name: fuzz

on:
  schedule:
    - cron: "0 4 * * 0" # Weekly, Sunday 04:00 UTC
  workflow_dispatch:

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v6

      - id: list
        run: |
          targets="$(make -s fuzz-list)"
          echo "list=$(jq -cn --arg t "$targets" '$t | split(" ")')" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run fuzzer (${{ matrix.target }}, 300s)
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -max_total_time=300 \
            -rss_limit_mb=4096 \
            -max_len=1048576

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
