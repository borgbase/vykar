[package]
name = "vykar-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone crate — not part of the main workspace.
[workspace]
members = ["."]
resolver = "3"

[dependencies]
libfuzzer-sys = "0.4"
rmp-serde = "1"
rmp = "0.8"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.11"
blake3 = "1"
argon2 = "0.6"

vykar-core = { path = "../crates/vykar-core", default-features = false, features = ["fuzzing"] }
vykar-crypto = { path = "../crates/vykar-crypto" }
vykar-types = { path = "../crates/vykar-types" }
vykar-protocol = { path = "../crates/vykar-protocol" }

[[bin]]
name = "fuzz_pack_scan"
path = "fuzz_targets/fuzz_pack_scan.rs"
doc = false

[[bin]]
name = "fuzz_pack_trailer"
path = "fuzz_targets/fuzz_pack_trailer.rs"
doc = false

[[bin]]
name = "fuzz_pack_map"
path = "fuzz_targets/fuzz_pack_map.rs"
doc = false

